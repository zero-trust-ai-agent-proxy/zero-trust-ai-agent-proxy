name: Docker integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - run: python -m pip install --no-compile --no-cache-dir -q -e ".[dev]"
      - run: python -m pip install --no-compile --no-cache-dir -q "zero-trust-agent-benchmark @ git+https://github.com/zero-trust-agent-benchmark/zero-trust-agent-benchmark@v0.1.0"
      - name: Pull integration images
        run: |
          docker pull envoyproxy/envoy:v1.40.2
          docker pull openpolicyagent/opa:1.22.0-static
          docker pull ghcr.io/spiffe/spire-server:1.15.5
      - run: python -m pytest -q tests/test_integration.py
        env:
          RUN_INTEGRATION_TESTS: '1'
